<!doctype html>
<html lang="en">

<head>
  <!-- Document Head And Metadata -->
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home - Edge Hill Drinks Vending Machine</title>
</head>

<body>
  <!-- Modal Overlay Container -->
  <div class="modal" hidden>
    <!-- Modal Inner Body -->
    <div class="modal-body menu-item">
      <h2 id="modal-header"></h2>
      <div id="modal-content"></div>
      <!-- Modal Action Buttons -->
      <div id="modal-btns">
        <button id="modal-green" class="green-btn" style="margin-bottom: 1rem">
          Confirm
        </button>
        <button id="modal-red" class="red-btn" onclick="Modal.hide()" hidden>
          Cancel
        </button>
      </div>
      <p id="modal-msg" class="msg" hidden></p>
    </div>
  </div>

  <!-- Header Title Bar Section -->
  <header id="title-bar">
    <h1>Edge Hill Drinks Vending Machine</h1>
  </header>

  <!-- Main Menu Interface Section -->
  <main id="main-menu">
    <!-- Drinks Inventory Panel -->
    <div class="menu-item" id="drinks-panel">
      <h2>Drinks</h2>
      <table>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Price</th>
          <th>Stock</th>
        </tr>
      </table>
    </div>

    <!-- Payment Processing Panel -->
    <div class="menu-item" id="payment-panel">
      <h2>Selected</h2>
      <p id="sel-drink-id">ID: N/A</p>
      <p id="sel-drink-name">Drink: N/A</p>
      <p id="sel-drink-price">Price: £N/A</p>
      <input type="number" id="input-drink-id" placeholder="Enter Drink ID" />
      <p id="sel-msg" class="msg" hidden></p>
      <button id="cash-btn" class="green-btn">Pay with Cash</button>
      <button id="card-btn" class="blue-btn">Pay with Card</button>
    </div>

    <!-- Administrator Controls Panel -->
    <div class="menu-item" id="admin-panel">
      <h2>Admin Panel</h2>
      <input type="password" id="input-admin-pass" placeholder="Enter Admin PIN" />
      <p id="admin-msg" class="msg" hidden></p>
      <button id="admin-btn" class="yellow-btn" onclick="controller.checkAdminPass()">
        Submit
      </button>
      <div class="admin-btns" hidden>
        <button id="restock-drink-btn" class="blue-btn">
          Restock Drinks
        </button>
        <button id="view-log-btn" class="purple-btn">View Log</button>
        <button id="view-cash-btn" class="green-btn">View Cash</button>
      </div>
    </div>

    <!-- Customer Loyalty Card Panel -->
    <div class="menu-item" id="loyalty-panel">
      <h2>Loyalty Card</h2>
      <input type="text" id="input-loyalty-id" placeholder="Enter Loyalty ID" />
      <p id="loyalty-msg" class="msg" hidden></p>
      <button id="loyalty-btn" class="green-btn">Submit</button>
    </div>
  </main>

  <script>
    // Drink Class Definition
    class Drink {
      #id;
      #name;
      #price;
      #stock;

      constructor(id, name, price, stock) {
        this.#id = id;
        this.#name = name;
        this.#price = price;
        this.#stock = stock;
      }

      get id() {
        return this.#id;
      }
      get name() {
        return this.#name;
      }
      get price() {
        return this.#price;
      }
      get stock() {
        return this.#stock;
      }
    }

    // Stock Sensor Integration Module
    class StockSensor {
      static #STOCK_DATA = [
        { id: "000", name: "Espresso", price: 1.5, weight: 150, stock: 0 },
        { id: "001", name: "Latte", price: 2.2, weight: 250, stock: 0 },
        {
          id: "002",
          name: "Hot Chocolate",
          price: 2.0,
          weight: 300,
          stock: 0,
        },
        {
          id: "003",
          name: "Bottled Water",
          price: 1.0,
          weight: 500,
          stock: 0,
        },
      ];

      // sync stock counts with weight sensor data
      static getStock() {
        const realStockData = WeightSensor.getRealStock();
        const updatedStockList = [];

        // iterate through stock items to match and update stock counts dynamically based on weight sensor readings
        for (const drink of this.#STOCK_DATA) {
          const match = realStockData.find((item) => item.id === drink.id);
          const currentStock = match ? match.realStock : 0;

          const drinkWithStock = {
            id: drink.id,
            name: drink.name,
            price: drink.price,
            stock: currentStock,
          };

          updatedStockList.push(drinkWithStock);
        }

        return updatedStockList;
      }

      static updateStock(drinkId, newStock) {
        const drink = this.#STOCK_DATA.find((d) => d.id === drinkId);
        if (drink) {
          drink.stock = newStock;
        }
      }
    }

    // Core Vending Controller Logic
    class VendingController {
      #adminPass = "1234";

      constructor() {
        this.drinks = [];
        this.selectedDrink = null;

        // initialize controller inventory by mapping stock data into drink instances
        StockSensor.getStock().forEach((stockDrink) => {
          this.drinks.push(
            new Drink(
              stockDrink["id"],
              stockDrink["name"],
              stockDrink["price"],
              stockDrink["stock"],
            ),
          );
        });
      }

      checkAdminPass() {
        const adminPassInput = document.getElementById("input-admin-pass");
        const adminPassBtn = document.getElementById("admin-btn");
        const adminMsg = document.getElementById("admin-msg");
        const adminBtns = document.querySelector(".admin-btns");

        const enteredPass = adminPassInput.value;
        // validate admin pin and toggle administrative control elements accordingly
        if (enteredPass === this.#adminPass) {
          adminMsg.hidden = true;
          adminBtns.hidden = false;
          adminBtns.style.display = "flex";
          adminPassInput.hidden = true;
          adminPassBtn.hidden = true;
        } else {
          adminMsg.textContent = "*Incorrect PIN. Please try again.";
          adminMsg.hidden = false;
          adminBtns.hidden = true;
          adminBtns.style.display = "none";
        }
      }

      selectDrink(id) {
        const msgElement = document.getElementById("sel-msg");
        const trimmedId = id.toString().trim();

        // clear selection if input length is insufficient
        if (trimmedId.length < 3) {
          msgElement.hidden = true;
          this.clearSelectionDisplay();
          return;
        }

        const drink = this.drinks.find((d) => d.id === trimmedId);

        // handle error if drink id is invalid
        if (!drink) {
          msgElement.textContent = "*Error: Invalid Drink ID.";
          msgElement.hidden = false;
          this.clearSelectionDisplay();
          return;
        }

        // handle error if chosen drink has zero stock
        if (drink.stock <= 0) {
          msgElement.textContent = `*Error: ${drink.name} is out of stock.`;
          msgElement.hidden = false;
          this.clearSelectionDisplay();
          return;
        }

        this.selectedDrink = drink;
        msgElement.hidden = true;

        PaymentModule.currentPrice = drink.price;
        // apply active loyalty discount to item price if user loyalty status is verified
        if (LoyaltyScanner.loyaltyStatus) {
          PaymentModule.currentPrice = PaymentModule.applyLoyaltyDiscount(
            drink.price,
          );
        }
        PaymentModule.updatePaymentDisplay(drink.id, drink.name);
      }

      clearSelectionDisplay() {
        this.selectedDrink = null;
        PaymentModule.currentPrice = 0;
        document.getElementById("sel-drink-id").textContent = "ID: N/A";
        document.getElementById("sel-drink-name").textContent = "Drink: N/A";
        document.getElementById("sel-drink-price").textContent =
          "Price: £N/A";
      }

      static updateSelectionMessage(message) {
        const msgElement = document.getElementById("sel-msg");
        if (msgElement) {
          msgElement.textContent = message;
          msgElement.hidden = false;
        }
      }

      renderDrinksTable() {
        const table = document.querySelector("#drinks-panel table");
        if (!table) return;

        let html = `
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Price</th>
              <th>Stock</th>
            </tr>
          `;

        // dynamically generate table rows for each available drink item in inventory
        this.drinks.forEach((drink) => {
          html += `
              <tr>
                <td>${drink.id}</td>
                <td>${drink.name}</td>
                <td>£${drink.price.toFixed(2)}</td>
                <td>${drink.stock}</td>
              </tr>
            `;
        });

        table.innerHTML = html;
      }
    }

    // Payment Module Component
    class PaymentModule {
      static currentPrice = 0;

      static applyLoyaltyDiscount(price) {
        const discountRate = 0.1;
        return price - (price * discountRate);
      }

      static updatePaymentDisplay(drinkID, drinkName) {
        const idDisplay = document.getElementById("sel-drink-id");
        const nameDisplay = document.getElementById("sel-drink-name");
        const priceDisplay = document.getElementById("sel-drink-price");

        // update price text layout and display active loyalty discount badge if applicable
        if (this.currentPrice > 0) {
          priceDisplay.innerHTML =
            `Price: £${this.currentPrice.toFixed(2)}` +
            (LoyaltyScanner.getLoyaltyStatus()
              ? "<b style='color: green;'> -10%</b>"
              : "");
        } else {
          priceDisplay.textContent = "Price: £N/A";
        }

        if (drinkID && drinkName) {
          idDisplay.textContent = `ID: ${drinkID}`;
          nameDisplay.textContent = `Drink: ${drinkName}`;
        } else {
          idDisplay.textContent = "ID: N/A";
          nameDisplay.textContent = "Drink: N/A";
        }
      }
    }

    // Modal Dialog Manager
    class Modal {
      static show(header, content, showCancel = false) {
        const modal = document.querySelector(".modal");
        const modalHeader = document.getElementById("modal-header");
        const modalContent = document.getElementById("modal-content");
        const modalCancelBtn = document.getElementById("modal-red");
        const modalConfirmBtn = document.getElementById("modal-green");
        const modalMsg = document.getElementById("modal-msg");

        modalHeader.textContent = header;
        modalContent.innerHTML = content;
        modalCancelBtn.hidden = !showCancel;

        modal.hidden = false;
      }

      static hide() {
        const modal = document.querySelector(".modal");
        const modalConfirmBtn = document.getElementById("modal-green");
        modal.hidden = true;
        modalConfirmBtn.disabled = false;
      }

      static confirmFunction(callback) {
        const confirmBtn = document.getElementById("modal-green");
        confirmBtn.onclick = () => {
          callback();
        };
      }

      static message(message) {
        const modalMsg = document.getElementById("modal-msg");
        modalMsg.textContent = message;
        modalMsg.hidden = false;
      }

      static hideMessage() {
        const modalMsg = document.getElementById("modal-msg");
        modalMsg.hidden = true;
      }
    }

    // Cash Receiver Mechanism Component
    class CashReceiver {
      static #totalInserted = 0.0;
      static #cash = [];

      static callModal() {
        this.#totalInserted = 0.0;
        this.#cash = [];
        let totalPrice = PaymentModule.currentPrice;

        const cashHTML = `
      <div class="cash-container">
        <div class="row">
          <button class="cash-note-btn tenner" onclick="CashReceiver.insertCash(10)">£10</button>
          <button class="cash-note-btn fiver" onclick="CashReceiver.insertCash(5)">£5</button>
        </div>
        <div class="row">
          <button class="cash-coin-btn" onclick="CashReceiver.insertCash(2)">£2</button>
          <button class="cash-coin-btn" onclick="CashReceiver.insertCash(1)">£1</button>
        </div>
        <div class="row">
          <button class="cash-coin-btn" onclick="CashReceiver.insertCash(0.5)">50p</button>
          <button class="cash-coin-btn" onclick="CashReceiver.insertCash(0.2)">20p</button>
        </div>
        <div class="row">
          <button class="cash-coin-btn" onclick="CashReceiver.insertCash(0.1)">10p</button>
          <button class="cash-note-btn tenner" onclick="CashReceiver.insertCash(10, 'fake 10')">"Tenner"</button>
        </div>
        <div class="row">
          <p id="cash-total">£0.00 / £${totalPrice.toFixed(2)}</p>
        </div>
      </div>
    `;

        const confirmBtn = document.getElementById("modal-green");
        confirmBtn.disabled = true;

        // handle cash confirmation and sequential change/drink dispatch flow
        Modal.confirmFunction(() => {
          const changeNeeded = parseFloat((this.#totalInserted - PaymentModule.currentPrice).toFixed(2));

          // helper function to handle dispensing the selected drink
          const dispenseSelectedDrink = () => {
            if (controller.selectedDrink) {
              const drinkName = controller.selectedDrink.name;
              const drinkId = controller.selectedDrink.id;

              WeightSensor.dispenseDrinkStock(drinkId);
              controller.renderDrinksTable();

              DrinkDispenser.dispenseDrink(drinkName);
            } else {
              Modal.hide();
            }
          };

          // check if change is required and calculate exact change breakdown
          if (changeNeeded > 0) {
            const changeResult = CashSensor.calculateChange(changeNeeded);
            if (!changeResult.success) {
              Modal.message("*Error: Machine cannot give exact change. Transaction cancelled.");
              return;
            } else {
              // pass dispenseSelectedDrink as a callback so drink dispenses after change collection
              ChangeDispenser.dispenseCash("change", changeNeeded, changeResult.change, dispenseSelectedDrink);
              return;
            }
          }

          dispenseSelectedDrink();
        });

        Modal.show("Pay with Cash", cashHTML, true);
      }

      static insertCash(value, type = "real") {
        // validate cash validity and track inserted totals against target price
        if (CashValidator.checkCashValidity(value, type)) {
          this.#totalInserted += value;
          this.updateCashTotal(
            this.#totalInserted,
            PaymentModule.currentPrice,
          );
          this.#cash.push(value.toString());
          if (this.#totalInserted >= PaymentModule.currentPrice) {
            const confirmBtn = document.getElementById("modal-green");
            const btns = document.querySelectorAll(
              ".cash-note-btn, .cash-coin-btn",
            );
            btns.forEach((btn) => {
              btn.disabled = true;
            });
            if (confirmBtn) {
              confirmBtn.disabled = false;
            }
          }
        } else {
          Modal.message("*Error: Invalid cash inserted.");
        }
      }

      static updateCashTotal(totalInserted, totalPrice) {
        const cashTotalElement = document.getElementById("cash-total");
        if (cashTotalElement) {
          cashTotalElement.textContent = `£${totalInserted.toFixed(
            2,
          )} / £${totalPrice.toFixed(2)}`;
        }
      }
    }

    // Card Reader Processing Component
    class CardReader {
      static callModal() {
        const cardHTML = `
        <input type="text" id="card-number" placeholder="Enter Card Number" style="margin-bottom: 1rem;" />
        <input type="password" id="card-pin" placeholder="Enter PIN" />
      `;

        // handle card submission and validate credentials via bank service
        Modal.confirmFunction(() => {
          const cardNumber = document.getElementById("card-number").value;
          const cardPin = document.getElementById("card-pin").value;

          if (
            BankService.processCardPayment(
              cardNumber,
              cardPin,
              PaymentModule.currentPrice,
            )
          ) {
            Modal.hide();
            Modal.hideMessage();

            if (controller.selectedDrink) {
              const drinkName = controller.selectedDrink.name;
              const drinkId = controller.selectedDrink.id;

              WeightSensor.dispenseDrinkStock(drinkId);
              controller.renderDrinksTable();
              
              DrinkDispenser.dispenseDrink(drinkName);
            }

            Modal.confirmFunction(() => {
              Modal.hide();
              controller.clearSelectionDisplay();
            });
          }
        });

        Modal.show("Pay with Card", cardHTML, true);
      }
    }

    // Loyalty Scanner Component
    class LoyaltyScanner {
      static loyaltyStatus = false;
      static #LOYALTY_DATA = [
        { id: "000", name: "John Smith", code: "ABC123" },
        { id: "001", name: "Jane Smith", code: "XYZ789" },
        { id: "002", name: "Bob Johnson", code: "DEF456" },
      ];

      static checkLoyaltyId() {
        const loyaltyIdInput = document.getElementById("input-loyalty-id");
        const loyaltyMsg = document.getElementById("loyalty-msg");
        const enteredId = loyaltyIdInput.value.trim();

        // search loyalty registry records by user id or discount code
        const loyaltyData = this.#LOYALTY_DATA.find(
          (loyalty) => loyalty.id === enteredId || loyalty.code === enteredId,
        );

        if (loyaltyData) {
          loyaltyMsg.textContent = `Welcome, ${loyaltyData.name}! (10% Discount Applied)`;
          loyaltyMsg.hidden = false;
          this.loyaltyStatus = true;

          // update current pricing dynamically if a drink is already selected
          if (controller.selectedDrink) {
            const basePrice = controller.selectedDrink.price;
            PaymentModule.currentPrice = this.applyLoyaltyDiscount(basePrice);
            PaymentModule.updatePaymentDisplay(
              controller.selectedDrink.id,
              controller.selectedDrink.name,
            );
          }
        } else {
          loyaltyMsg.textContent = "*Error: Invalid Loyalty ID.";
          loyaltyMsg.hidden = false;
          this.loyaltyStatus = false;
        }
      }

      static applyLoyaltyDiscount(price) {
        return price * 0.9;
      }

      static getLoyaltyStatus() {
        return this.loyaltyStatus;
      }
    }

    // Bank Service Simulation Component
    class BankService {
      static #SAVED_CARDS = [
        { number: "1234567890", pin: "1234" },
        { number: "0987654321", pin: "4321" },
      ];
      static processCardPayment(cardNumber, cardPin, amount) {
        console.log(`Processing card payment for £${amount.toFixed(2)}`);
        const card = this.#SAVED_CARDS.find(
          (c) => c.number === cardNumber && c.pin === cardPin,
        );

        // verify card details against saved records
        if (!card) {
          Modal.message("*Invalid card number or PIN.");
          return false;
        } else {
          console.log("Card payment successful.");
          return true;
        }
      }
    }

    // Drink Dispenser UI Component
    class DrinkDispenser {
      static dispenseDrink(drinkName) {
        Modal.show(
          "Dispensing Drink",
          `<div class="modal-terminal">
             Your <b style='color: green;'>${drinkName}</b> is being prepared and dispensed. 
             <br><br>Please collect your drink from the slot!
           </div>`,
          false
        );

        const confirmBtn = document.getElementById("modal-green");
        confirmBtn.textContent = "Confirm";
        confirmBtn.disabled = false;
        
        Modal.confirmFunction(() => {
          Modal.hide();
          controller.clearSelectionDisplay();
        });
      }
    }

    // Cash Validator Component
    class CashValidator {
      static validCash = [10, 5, 2, 1, 0.5, 0.2, 0.1];
      static checkCashValidity(value, type) {
        // check whether inserted currency matches accepted valid denominations and type
        if (type === "real" && this.validCash.includes(value)) {
          return true;
        } else {
          ChangeDispenser.dispenseCash("rejected", value);
          return false;
        }
      }
    }

    // Cash Sensor Inventory Component
    class CashSensor {
      static #CASH_DATA = [
        { type: "£10", worth: 10, stock: 10 },
        { type: "£5", worth: 5, stock: 10 },
        { type: "£2", worth: 2, stock: 10 },
        { type: "£1", worth: 1, stock: 10 },
        { type: "50p", worth: 0.5, stock: 10 },
        { type: "20p", worth: 0.2, stock: 10 },
        { type: "10p", worth: 0.1, stock: 10 },
      ];

      static getCashData() {
        return this.#CASH_DATA;
      }

      // calculate exact change breakdown using greedy approach algorithm
      static calculateChange(changeNeeded) {
        const changeToDispense = [];

        for (let i = 0; i < this.#CASH_DATA.length; i++) {
          const item = this.#CASH_DATA[i];
          if (changeNeeded <= 0) {
            break;
          }

          let count = Math.floor(changeNeeded / item.worth);

          if (count > item.stock) {
            count = item.stock;
          }

          if (count > 0) {
            changeToDispense.push({ type: item.type, worth: item.worth, count: count });
            changeNeeded = parseFloat((changeNeeded - (count * item.worth)).toFixed(2));
          }
        }

        // return failure flag if exact change cannot be fulfilled from available reserves
        if (changeNeeded > 0) {
          console.log("Machine cannot provide exact change!");
          return { success: false, change: [] };
        }

        console.log("Machine can provide exact change.");
        return { success: true, change: changeToDispense };
      }
    }

    // Weight Sensor Inventory Tracking Component
    class WeightSensor {
      static #WEIGHT_DATA = [
        {
          id: "000",
          name: "Espresso",
          weight: 3300,
          fakeStock: 22,
          individualWeight: 150,
        },
        {
          id: "001",
          name: "Latte",
          weight: 3500,
          fakeStock: 10,
          individualWeight: 350,
        },
        {
          id: "002",
          name: "Hot Chocolate",
          weight: 5250,
          fakeStock: 15,
          individualWeight: 350,
        },
        {
          id: "003",
          name: "Bottled Water",
          weight: 10000,
          fakeStock: 20,
          individualWeight: 500,
        },
      ];
      static #totalWeights = [];

      static calculateRealStock() {
        // compute real stock levels based on current weights divided by item individual weights
        this.#totalWeights = this.#WEIGHT_DATA.map((drink) => {
          const realStock = Math.floor(drink.weight / drink.individualWeight);
          return { id: drink.id, name: drink.name, realStock };
        });
      }

      static getRealStock() {
        this.calculateRealStock();
        return this.#totalWeights;
      }

      // safely reduce drink weight when purchased
      static dispenseDrinkStock(drinkId) {
        const drink = this.#WEIGHT_DATA.find((d) => d.id === drinkId);
        if (drink && drink.weight >= drink.individualWeight) {
          drink.weight -= drink.individualWeight;
        }
      }

      static getDrinkIndividualWeight(drinkId) {
        const drink = this.#WEIGHT_DATA.find((d) => d.id === drinkId);
        return drink ? drink.individualWeight : null;
      }
    }

    class TransactionTimer { }

    // Change Dispenser Handles Physical Payout And Inventory Sync
    class ChangeDispenser {
      static dispenseCash(type, value, changeData = [], onCollect = null) {
        if (type === "change") {
          // deduct dispensed change quantities from internal cash stock data registers
          for (const dispensed of changeData) {
            const cashItem = CashSensor.getCashData().find(c => c.type === dispensed.type);
            if (cashItem) {
              cashItem.stock -= dispensed.count;
            }
          }

          const breakdownHtml = changeData
            .map(item => `${item.type}: ${item.count}`)
            .join("<br>");

          const changeHTML = `
            <div class="modal-terminal" style="margin-bottom: 1rem;" >
              ${breakdownHtml}
            </div>
            <p class="msg">* Change succesfully provided</p>
          `;

          // show modal with title "Change" matching layout requirement
          Modal.show("Change", changeHTML, false);

          const confirmBtn = document.getElementById("modal-green");
          confirmBtn.textContent = "Collect";
          confirmBtn.disabled = false;

          Modal.confirmFunction(() => {
            confirmBtn.textContent = "Confirm";
            Modal.hide();

            // trigger next step after collecting change
            if (typeof onCollect === "function") {
              onCollect();
            }
          });

          console.log(`Dispensing change: £${value.toFixed(2)}`);

        } else if (type === "rejected") {
          Modal.show(
            "Invalid Cash",
            `<div class="modal-terminal">The cash you inserted (£${value.toFixed(2)}) has been <b style='color: red;'>rejected</b> for being damaged or fake.</div>`,
            false
          );

          const confirmBtn = document.getElementById("modal-green");
          confirmBtn.textContent = "Confirm";
          confirmBtn.disabled = false;

          Modal.confirmFunction(() => {
            Modal.hide();
            Modal.hideMessage();
          });

          console.log(`Rejecting invalid cash: £${value.toFixed(2)}`);
        }
      }
    }

    class Logger { }
    class TransactionRecord { }

    // Application Initialization Section
    const controller = new VendingController();
    controller.renderDrinksTable();

    // Event Listeners Registration Section
    const idField = document.getElementById("input-drink-id");
    idField.addEventListener("input", (e) => {
      controller.selectDrink(e.target.value);
    });

    const adminPassInput = document.getElementById("input-admin-pass");
    adminPassInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        controller.checkAdminPass();
      }
    });

    const loyaltyIdInput = document.getElementById("input-loyalty-id");
    loyaltyIdInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        LoyaltyScanner.checkLoyaltyId();
      }
    });

    const loyaltyBtn = document.getElementById("loyalty-btn");
    loyaltyBtn.addEventListener("click", () => {
      LoyaltyScanner.checkLoyaltyId();
    });

    const cashBtn = document.getElementById("cash-btn");
    cashBtn.addEventListener("click", () => {
      if (controller.selectedDrink) {
        CashReceiver.callModal();
      } else {
        VendingController.updateSelectionMessage(
          "Please select a drink first.",
        );
      }
    });

    const cardBtn = document.getElementById("card-btn");
    cardBtn.addEventListener("click", () => {
      if (controller.selectedDrink) {
        CardReader.callModal();
      } else {
        VendingController.updateSelectionMessage(
          "Please select a drink first.",
        );
      }
    });
  </script>
</body>

</html>
